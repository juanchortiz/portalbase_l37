name: Daily Portal Base Sync

on:
  schedule:
    # Run daily at 5:30 PM UTC (6:30 PM Portugal time, after Base.gov.pt publishes)
    - cron: '30 17 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  sync-and-create-deals:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Download database from previous run
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: base-cache-db
          path: .
      
      - name: Update saved search from JSON (if exists)
        continue-on-error: true
        run: |
          if [ -f "Biogerm_search.json" ]; then
            echo "📋 Found Biogerm_search.json - updating saved search..."
            python3 << 'EOF'
          import sqlite3
          import json
          import os
          
          search_file = "Biogerm_search.json"
          
          if os.path.exists(search_file):
              with open(search_file, 'r') as f:
                  search_data = json.load(f)
              
              db_path = 'base_cache.db'
              
              # Create database if it doesn't exist
              conn = sqlite3.connect(db_path)
              cursor = conn.cursor()
              
              # Ensure saved_searches table exists
              cursor.execute("""
                  CREATE TABLE IF NOT EXISTS saved_searches (
                      id INTEGER PRIMARY KEY AUTOINCREMENT,
                      name TEXT UNIQUE NOT NULL,
                      filters TEXT NOT NULL,
                      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
                      last_used TIMESTAMP
                  )
              """)
              
              # Insert or update the search
              filters_json = json.dumps(search_data['filters'])
              cursor.execute("""
                  INSERT OR REPLACE INTO saved_searches (name, filters, last_used)
                  VALUES (?, ?, datetime('now'))
              """, (search_data['name'], filters_json))
              
              conn.commit()
              conn.close()
              
              print(f"✅ Updated saved search: {search_data['name']}")
              print(f"   CPV Codes: {search_data['filters'].get('cpv_codes', [])}")
          else:
              print("⚠️  Biogerm_search.json not found - skipping search update")
          EOF
          else
            echo "⚠️  Biogerm_search.json not found - skipping search update"
          fi
      
      - name: Run daily automation
        env:
          BASE_API_KEY: ${{ secrets.BASE_API_KEY }}
          HUBSPOT_API_TOKEN: ${{ secrets.HUBSPOT_BIOGERM_API_TOKEN }}
          AUTOMATION_SAVED_SEARCH: ${{ secrets.AUTOMATION_SAVED_SEARCH || 'Biogerm' }}
          DAYS_TO_CHECK: ${{ secrets.DAYS_TO_CHECK || '1' }}
        run: |
          python daily_automation.py
      
      - name: Upload database (optional - for backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base-cache-db
          path: base_cache.db
          retention-days: 7
          if-no-files-found: ignore


